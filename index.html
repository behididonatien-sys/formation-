<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acheter en Chine depuis le Tchad – Formation Alibaba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --ink:#002664; --muted:#4F5D78;
  --accent:#FECB00; --accent-ink:#1B1400; --line:#C8D2E3; --red:#C60C30; --wm-blue:#002664; --ok:#2F7D4F; --ok-bg:#E3F1E7;
  --warn-bg:#FBF1D6; --lock:#9AA3B5; --route:#18233F;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10172A; --surface:#19223A; --ink:#E8ECF4; --muted:#A3ACC2;
    --accent:#F2B825; --accent-ink:#1B1400; --line:#2C3754; --ok:#5DBB83; --ok-bg:#16301F;
    --warn-bg:#332A10; --lock:#5A647D; --route:#E8ECF4; --red:#FF5A6E; --wm-blue:#6F9CFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10172A; --surface:#19223A; --ink:#E8ECF4; --muted:#A3ACC2;
  --accent:#F2B825; --accent-ink:#1B1400; --line:#2C3754; --ok:#5DBB83; --ok-bg:#16301F;
  --warn-bg:#332A10; --lock:#5A647D; --route:#E8ECF4; --red:#FF5A6E; --wm-blue:#6F9CFF;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:18px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
h1,h2,h3{font-family:"Archivo","Arial Narrow",Arial,sans-serif;line-height:1.15;margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* En-tête */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:#fff}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
header.top .brand{font-family:"Archivo",Arial,sans-serif;font-weight:800;font-size:17px;flex:1}
header.top button{background:transparent;border:0;color:#fff;padding:8px 4px;font-size:16px}
:root[data-theme="dark"] header.top, :root[data-theme="dark"] body::before{background:#001A47}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top,:root:not([data-theme="light"]) body::before{background:#001A47}}

/* Accueil */
.hero{padding:34px 0 18px}
.hero h1{font-size:clamp(34px,8vw,52px);font-weight:800;letter-spacing:-0.01em}
.hero p{color:var(--muted);max-width:34em;margin:14px 0 0}
.progress{margin:22px 0 6px;background:var(--line);height:10px;border-radius:5px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);width:0;transition:width .5s}
.progress-label{font-size:15px;color:var(--muted)}

/* La route Chine → N'Djamena */
.route{list-style:none;margin:26px 0 8px;padding:0;position:relative}
.route::before{content:"";position:absolute;left:19px;top:12px;bottom:12px;width:3px;background:repeating-linear-gradient(var(--route) 0 10px,transparent 10px 18px);opacity:.35}
.city{font-family:"Archivo",Arial,sans-serif;font-weight:700;font-size:14px;color:var(--muted);padding:4px 0 10px 52px;position:relative}
.city::before{content:"";position:absolute;left:12px;top:6px;width:17px;height:17px;border-radius:50%;border:3px solid var(--route);background:var(--bg)}
.stop{position:relative;padding:0 0 14px 52px}
.stop .dot{position:absolute;left:8px;top:16px;width:25px;height:25px;border-radius:50%;background:var(--surface);border:3px solid var(--lock);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--lock)}
.stop.open .dot{border-color:var(--accent);color:var(--ink)}
.stop.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.stop button{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--ink)}
.stop.locked button{opacity:.6}
.stop .t{font-weight:700;display:block}
.stop .s{font-size:15px;color:var(--muted)}
.extras{display:grid;gap:10px;margin:22px 0 40px}
.extras button{background:transparent;border:2px solid var(--ink);color:var(--ink);border-radius:10px;padding:14px 16px;text-align:left;font-weight:700}

/* Module */
.module{padding:26px 0 60px}
.module .num{font-family:"Archivo",Arial,sans-serif;font-weight:800;color:var(--accent);font-size:18px}
.module h1{font-size:clamp(28px,6.5vw,40px);margin:4px 0 16px}
.module h2{font-size:22px;margin:30px 0 10px}
.module h3{font-size:19px;margin:22px 0 8px}
.module p,.module li{max-width:38em}
.module ul,.module ol{padding-left:1.3em}
.module li{margin:4px 0}
.module blockquote{margin:14px 0;padding:12px 16px;background:var(--surface);border-left:5px solid var(--accent);border-radius:4px;font-style:italic}
.tablebox{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:16px;min-width:480px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-family:"Archivo",Arial,sans-serif;font-weight:700;font-size:15px;background:var(--bg)}
tr:last-child td{border-bottom:0}
.note{background:var(--warn-bg);padding:12px 16px;border-radius:8px;margin:14px 0}
.exercise{background:var(--ok-bg);padding:14px 16px;border-radius:8px;margin:22px 0}
.exercise strong{display:block;margin-bottom:4px}

/* Audio */
.audio{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 22px}
.audio .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.audio .row button{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:20px;padding:6px 14px;font-size:16px}
.audio .row button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.audio audio{width:100%;margin-top:10px}
.audio .empty{color:var(--muted);font-size:15px;margin-top:8px}
.artext{margin-top:12px}
.artext summary{cursor:pointer;font-weight:700;padding:6px 0}
.ar{font-family:"Noto Naskh Arabic","Geeza Pro","Segoe UI",Arial,sans-serif;font-size:20px;line-height:1.9;text-align:right}
.ar h3{font-family:inherit;font-size:21px;margin:18px 0 6px}
.ar ul{padding-right:1.3em;padding-left:0}

/* Quiz */
.quiz{border-top:3px solid var(--ink);margin-top:36px;padding-top:18px}
.q{margin:18px 0}
.q p{font-weight:700;margin:0 0 8px}
.q label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:6px 0;background:var(--surface)}
.q input{margin-top:5px;width:20px;height:20px;flex:none}
.q label.right{border-color:var(--ok);background:var(--ok-bg)}
.q label.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--surface))}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:14px 20px;font-weight:700;font-size:17px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.result{margin-top:14px;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;max-width:90%;font-size:16px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}

/* Certificat */
.sexpick{border:0;padding:0;margin:8px 0 14px;display:flex;flex-wrap:wrap;gap:10px 24px}
.sexpick legend{padding:0;margin-bottom:6px}
.sexpick label{display:flex;align-items:center;gap:8px;font-size:18px}
.sexpick input{width:22px;height:22px}
.gstats .on{border-color:var(--ok);background:var(--ok-bg)}
.dotOn{display:inline-block;width:11px;height:11px;border-radius:50%;background:#2FB45E;margin-right:7px;vertical-align:middle}
.gprog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 4px;max-width:320px}
.gprog span{display:block;height:100%;background:var(--ink)}
img.flag,.flag{display:inline-block;width:28px;height:20px;object-fit:cover;border-radius:3px;margin-right:10px;vertical-align:-3px;box-shadow:0 0 0 1px var(--line)}
.flag.noflag{background:var(--line)}
[dir="rtl"] img.flag,[dir="rtl"] .flag{margin-right:0;margin-left:10px}
.space{display:block;width:100%;text-align:start;text-decoration:none;background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-inline-start:8px solid var(--red);border-radius:12px;padding:16px 18px;margin:18px 0;font:inherit}
.space .t{display:block;font-family:"Archivo",Arial,sans-serif;font-weight:800;font-size:22px;line-height:1.25}
.space .s{display:block;color:var(--muted);font-size:16px;margin-top:4px}
.space .lk{display:block;color:var(--muted);font-size:15px;margin-top:6px}
.space.trainer{border-inline-start-color:var(--accent);margin:28px 0 40px}
.profcard{background:var(--warn-bg);border-radius:12px;padding:16px;margin:18px 0}
.profcard p{margin:0 0 12px}
ul.salle,ul.glist{list-style:none;padding:0;margin:16px 0}
ul.salle li,ul.glist li{border-bottom:1px solid var(--line);padding:12px 2px}
ul.salle .n,ul.glist .n{display:block;font-weight:700;font-size:18px}
ul.salle .p,ul.salle .d,ul.glist .p{display:block;color:var(--muted);font-size:15px}
ul.glist li.revoked .n{color:var(--muted);text-decoration:line-through}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 8px;border-radius:6px;vertical-align:middle;text-decoration:none}
.tag.done{background:var(--ok-bg);color:var(--ok)}.tag.run{background:var(--warn-bg);color:var(--ink)}.tag.revoked{background:#FBE3E6;color:#9B0A26}
.gact{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}.gact .btn{padding:9px 14px;font-size:15px}
.linkbtn{background:none;border:0;color:var(--red);text-decoration:underline;font:inherit;font-size:15px;padding:6px 0;cursor:pointer}
#gInfo .linkbtn{color:var(--ink);margin-left:8px}
.warn{color:var(--red);font-weight:700}
.gstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}
.gstats div{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px;font-size:15px;color:var(--muted)}
.gstats b{display:block;font-size:28px;color:var(--ink)}
.tscroll{overflow-x:auto}
table.gtab{border-collapse:collapse;width:100%;min-width:0;font-size:16px;margin:8px 0 18px}
table.gtab th,table.gtab td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
table.gtab td+td,table.gtab th+th{text-align:right}
.certimg{display:block;width:100%;height:auto;margin:22px 0 4px;border:1px solid var(--line);border-radius:4px;background:#fff}
.certwait{color:var(--muted);margin:24px 0}
.vres{margin-top:18px;padding:14px 16px;border-radius:10px;border:2px solid var(--line);font-weight:700}
.vres.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.vres.bad{background:#FBE3E6;color:#9B0A26;border-color:var(--red)}
@media print{.certimg{border:0;margin:0}}
.cert{background:var(--surface);border:6px double var(--ink);padding:34px 22px;text-align:center;margin:24px 0}
.cert .org{font-family:"Archivo",Arial,sans-serif;font-weight:800;font-size:18px}
.cert .name{font-family:"Archivo",Arial,sans-serif;font-weight:800;font-size:clamp(26px,7vw,38px);margin:18px 0;border-bottom:2px solid var(--accent);display:inline-block;padding:0 10px 4px}
.field{display:block;width:100%;padding:12px;font:inherit;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);margin:8px 0 14px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.check input{width:22px;height:22px;flex:none;margin-top:3px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media print{header.top,.actions,.noprint{display:none!important}body{background:#fff;color:#000}.cert{border-color:#000}}

a.btn{text-decoration:none;text-align:center}
.xbtn{display:block;background:transparent;border:2px solid var(--ink);color:var(--ink);border-radius:10px;padding:14px 16px;font-weight:700;text-decoration:none}
.audio .row button.listen{background:var(--accent);color:var(--accent-ink);border:0;font-weight:700;font-size:18px;padding:12px 20px;border-radius:24px}
.langpick{text-align:center}
.langs{display:grid;gap:14px;margin:30px auto 0;max-width:360px}
.langs button{font-size:24px;font-weight:700;padding:18px;border-radius:12px;border:2px solid var(--ink);background:var(--surface);color:var(--ink)}
.langs button[lang="ar"]{font-family:"Noto Naskh Arabic","Geeza Pro","Segoe UI",Arial,sans-serif;font-size:28px}
header.top .brand{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[dir="rtl"] body{font-family:"Noto Naskh Arabic","Geeza Pro","Segoe UI",Arial,sans-serif;font-size:20px;line-height:1.85}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3{font-family:"Noto Naskh Arabic","Geeza Pro","Segoe UI",Arial,sans-serif;line-height:1.4}
[dir="rtl"] .route::before{left:auto;right:19px}
[dir="rtl"] .city{padding:4px 52px 10px 0}
[dir="rtl"] .city::before{left:auto;right:12px}
[dir="rtl"] .stop{padding:0 52px 14px 0}
[dir="rtl"] .stop .dot{left:auto;right:8px}
[dir="rtl"] .stop button,[dir="rtl"] .extras button,[dir="rtl"] th,[dir="rtl"] td{text-align:right}
[dir="rtl"] .module ul,[dir="rtl"] .module ol{padding-left:0;padding-right:1.3em}
[dir="rtl"] .module blockquote{border-left:0;border-right:5px solid var(--accent)}
[dir="rtl"] .module blockquote[dir="ltr"]{border-right:0;border-left:5px solid var(--accent);text-align:left}
.wapanel{position:fixed;inset:0;z-index:20;background:rgba(10,15,29,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.wabox{background:var(--surface);color:var(--ink);border-radius:14px;padding:20px;width:100%;max-width:520px;max-height:85vh;overflow:auto}
.wabox h2{font-size:22px;margin-bottom:10px}
.wabox blockquote{margin:10px 0;padding:10px 14px;background:var(--bg);border-left:5px solid var(--accent);border-radius:4px}
.wabox a.btn{display:block;margin:14px 0 6px;background:#25D366;color:#0B2E17}
.wabox .field{font-size:15px}
.tcard{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:18px 0 0;color:var(--ink)}
.tcard img{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none;border:3px solid var(--accent)}
.tcard .t{display:block;font-weight:700;font-size:19px}
.tcard .s{display:block;font-size:15px;color:var(--muted)}
.spkrow{display:flex;align-items:center;gap:14px}
.spk{flex:none;width:68px;height:68px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.spk.on,.fab.on{background:var(--ok);color:#fff}
.spktxt{flex:1;min-width:0}
.spktxt strong{display:block;font-size:18px}
.spktxt .empty{display:block;margin-top:2px}
.stopb{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:transparent;color:var(--ink);font-size:16px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
[dir="rtl"] .fab{right:auto;left:18px}
.module{padding-bottom:110px}
.tcard .hint{display:block;margin-top:6px;font-size:15px;font-weight:700;color:var(--ink);text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:4px}
.tphoto{display:block;width:100%;max-width:640px;border-radius:12px;margin:12px 0 18px}
.trainer .titles{color:var(--muted);font-weight:700}
.trainer .motto{margin-top:22px;font-size:19px}
header.top::after{content:"";display:block;height:5px;background:linear-gradient(90deg,#002664 0 33.34%,#FECB00 33.34% 66.67%,#C60C30 66.67%)}
.wm{font-weight:800;white-space:nowrap}
.wm .b{color:var(--wm-blue)}
.wm .y{color:#FECB00;-webkit-text-stroke:0.5px #7A5E00;paint-order:stroke fill;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.wm .r{color:var(--red)}
.cert .org .wm{font-size:22px}
.unlockbig{display:block;width:100%;margin-top:18px;font-size:18px}
.price{font-family:"Archivo",Arial,sans-serif;font-weight:800;font-size:34px;color:var(--ink);margin:6px 0}
.paynums{display:grid;gap:10px;margin:10px 0 6px}
.paynum{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.paynum .op{font-weight:800;padding:4px 10px;border-radius:6px;color:#fff}
.paynum .op.airtel{background:#E40000}
.paynum .op.moov{background:#0057A8}
.paynum .n{font-family:"Archivo",Arial,sans-serif;font-weight:800;font-size:24px;flex:1}
.paynum .btn{padding:8px 14px;font-size:15px}
.pay label,.module label{display:block;font-weight:700;margin-top:8px}
.codebox{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:16px;margin:16px 0}
.codeval{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:700;word-break:break-all;background:var(--bg);padding:10px;border-radius:8px}
.filepick{display:inline-block;cursor:pointer;margin:4px 0}
.shotprev{display:block;max-width:180px;border-radius:8px;margin:10px 0;border:1px solid var(--line)}
.shot h3{margin-bottom:6px}
.adminlink{text-align:center;margin:0 0 30px;font-size:14px}
.adminlink a{color:var(--muted)}
textarea.field{font-size:15px;line-height:1.4}
.explain{background:var(--warn-bg);border-left:5px solid var(--accent);border-radius:8px;padding:12px 14px;margin:6px 0 12px}
[dir="rtl"] .explain{border-left:0;border-right:5px solid var(--accent)}
.exhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.explain p{margin:8px 0 0}
.explain .newq{font-weight:700}
.spk.small{width:48px;height:48px}
.spk.small svg{width:26px;height:26px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button id="homeBtn" hidden>‹ Accueil</button>
  <span class="brand" id="brand">Formation Alibaba – Tchad</span>
  <button id="langBtn">FR 🌐</button>
  <button id="themeBtn" aria-label="Changer le thème">◐</button>
</div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   RÉGLAGES À COMPLÉTER PAR LE FORMATEUR
   ============================================================ */
const CONFIG = {
  // Lien du groupe WhatsApp (https://chat.whatsapp.com/...) OU lien du numéro (https://wa.me/235XXXXXXXX)
  whatsapp: "https://chat.whatsapp.com/CiMvAwIVTNc1u6fCXfVZ1a",
  // Discussion privée avec le formateur
  prive: "https://wa.me/23563575381",
  formateur: "Béhidi Donatien",
  ecole: "Winner Mindset Academy",
  // Audios par module : coller ici le lien ou le fichier audio (fr = français, ar = arabe tchadien)
  audios: {
    intro:{fr:"",ar:""}, 1:{fr:"",ar:""}, 2:{fr:"",ar:""}, 3:{fr:"",ar:""}, 4:{fr:"",ar:""}, 5:{fr:"",ar:""},
    6:{fr:"",ar:""}, 7:{fr:"",ar:""}, 8:{fr:"",ar:""}, 9:{fr:"",ar:""}, 10:{fr:"",ar:""}
  },
  // Réponses du formateur (FAQ) : {module:4, question:"…", reponse:"…", audio:""}
  faq: []

fr:`<p class="titles">Sociologue du développement · Anthropologue de la santé · Entrepreneur · Formateur · Consultant en suivi-évaluation · Visionnaire de ${WM}</p>
<p>Je suis Behidi Donatien, sociologue du développement et anthropologue de la santé, entrepreneur, formateur et consultant en suivi-évaluation. Je suis aussi le visionnaire de ${WM}, une initiative dédiée au développement personnel, à l’entrepreneuriat, à l’investissement et au renforcement des compétences.</p>
<p>Passionné par la recherche, l’innovation, l’entrepreneuriat et la transmission des connaissances, j’accompagne les jeunes et les porteurs de projets pour qu’ils développent leurs compétences et transforment les opportunités en projets concrets.</p>
<p>Mon parcours académique et professionnel m’a donné une expérience du développement, de la gestion de projets, du suivi-évaluation et de l’accompagnement des initiatives, ainsi qu’une bonne compréhension des réalités sociales et économiques des communautés.</p>
<p>Avec ${WM}, je veux créer un espace où les jeunes développent un état d’esprit entrepreneurial, acquièrent des compétences pratiques et saisissent mieux les opportunités du numérique et des marchés internationaux.</p>
<h2>La formation : acheter en ligne et importer depuis la Chine</h2>
<p>Dans cette formation, « Comment acheter en ligne : de la recherche du produit à la réception de la marchandise », nous parcourons de façon pratique toutes les étapes d’un achat international : recherche du produit, choix et vérification des fournisseurs, négociation, commande, paiement, transport, suivi de la livraison, calcul du coût de revient et de la marge.</p>
<p>Le but n’est pas seulement de vous montrer où acheter, mais de vous apprendre à acheter intelligemment, à réduire les risques et à transformer un achat en véritable opportunité commerciale.</p>

en:`<p class="titles">Development sociologist · Health anthropologist · Entrepreneur · Trainer · Monitoring and evaluation consultant · Founder and visionary of ${WM}</p>

<p>Through ${WM}, I want to create a place where young people build an entrepreneurial mindset, gain practical skills and make better use of the opportunities offered by the digital world and international markets.</p>

<p>In this course, “How to buy online: from finding the product to receiving the goods”, we work through every step of an international purchase in a practical way: finding the product, choosing and checking suppliers, negotiating, ordering, paying, shipping, tracking delivery, and calculating your cost price and margin.</p>

/* Lecture à voix haute */
const TTS_OK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let ttsState = "idle";
if(TTS_OK){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = ()=>{}; }catch(e){} }
const VOICE_ORDER = {
  en:["en-NG","en-GH","en-KE","en-TZ","en-ZA","en-GB","en-US"],
  fr:["fr-SN","fr-CI","fr-CM","fr-FR","fr-BE","fr-CA"],
  ar:["ar-SD","ar-TD","ar-EG","ar-SA","ar-XA"]
};
function pickVoice(code){
  const v = TTS_OK ? speechSynthesis.getVoices() : [];
  const norm = s => (s||"").replace("_","-").toLowerCase();
  for(const tag of VOICE_ORDER[code]){ const f=v.find(x=>norm(x.lang)===tag.toLowerCase()); if(f) return f; }
  return v.find(x=>norm(x.lang).startsWith(code)) || null;
}
function stopSpeech(){ if(TTS_OK){ try{ speechSynthesis.cancel(); }catch(e){} } ttsState="idle"; }
function lessonSentences(){
  const art = app.querySelector("article .lesson"); if(!art) return [];
  const out = [];
  art.querySelectorAll("h1,h2,h3,p,li,blockquote,tr,.note,.exercise").forEach(el=>{
    let t = el.tagName==="TR" ? [...el.children].map(td=>td.textContent.trim()).join(". ") : el.textContent;
    t = t.replace(/\s+/g," ").replace(/→/g,", ").trim();
    if(state.uilang==="fr") t = t.replace(/×/g," fois ").replace(/m³/g," mètres cubes");
    if(state.uilang==="en") t = t.replace(/×/g," by ").replace(/m³/g," cubic metres");
    if(t) t.split(/(?<=[.!?؟;:])\s+/).forEach(s=>{ if(s.trim()) out.push(s.trim()); });
  });
  return out;
}
const SPK = `<svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
const PAU = `<svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>`;
function setTts(mode){
  const icon = mode==="playing" ? PAU : SPK;
  const label = mode==="playing" ? u().pause : mode==="paused" ? u().resume : u().listen;
  ["ttsPlay","ttsFab"].forEach(id=>{ const b=document.getElementById(id); if(b){ b.innerHTML=icon; b.setAttribute("aria-label",label); b.classList.toggle("on",mode==="playing"); } });
  const l=document.getElementById("ttsLabel"); if(l) l.textContent=label;
}
function playSpeech(){
  if(!TTS_OK){ toast(u().noTts); return; }
  if(ttsState==="playing"){ speechSynthesis.pause(); ttsState="paused"; setTts("paused"); return; }
  if(ttsState==="paused"){ speechSynthesis.resume(); ttsState="playing"; setTts("playing"); return; }
  const parts = lessonSentences(); if(!parts.length) return;
  const code = u().tts, voice = pickVoice(code);
  const langTag = {fr:"fr-FR",en:"en-GB",ar:"ar-SA"}[code];
  speechSynthesis.cancel();
  parts.forEach((p,k)=>{
    const ut = new SpeechSynthesisUtterance(p);
    ut.lang = voice ? voice.lang : langTag; if(voice) ut.voice = voice; ut.rate = {en:0.78, fr:0.85, ar:0.82}[code];
    if(k===parts.length-1) ut.onend = ()=>{ ttsState="idle"; setTts("idle"); };
    speechSynthesis.speak(ut);
  });
  ttsState="playing"; setTts("playing");
  if(!voice) toast(u().noVoice);
}
function speakText(t){
  if(!TTS_OK){ toast(u().noTts); return; }
  stopSpeech(); setTts("idle");
  const code=u().tts, voice=pickVoice(code);
  t.split(/(?<=[.!?؟;:])\s+/).forEach(p=>{ if(!p.trim()) return;
    const ut=new SpeechSynthesisUtterance(p.replace(/×/g, code==="fr"?" fois ":code==="en"?" by ":" ضرب ").replace(/m³/g, code==="fr"?" mètre cube":code==="en"?" cubic metre":" متر مكعب"));
    ut.lang = voice ? voice.lang : {fr:"fr-FR",en:"en-GB",ar:"ar-SA"}[code]; if(voice) ut.voice=voice; ut.rate={en:0.78,fr:0.85,ar:0.82}[code];
    speechSynthesis.speak(ut); });
  if(!voice) toast(u().noVoice);
}
function audioBlock(key){
  const a = (CONFIG.audios[key]||{})[state.uilang==="ar"?"ar":"fr"];
  const rec = state.uilang!=="en" && a ? `<audio controls preload="none" src="${a}" style="width:100%;margin-top:10px"></audio>` : "";
  return `<div class="audio noprint"><div class="spkrow">
    <button class="spk" id="ttsPlay" aria-label="${u().listen}">${SPK}</button>
    <div class="spktxt"><strong id="ttsLabel">${u().listen}</strong><span class="empty">${TTS_OK ? u().listenNote : u().noTts}</span></div>
    <button class="stopb" id="ttsStop" aria-label="${u().stop}">■</button></div>${rec}</div>
    <button class="fab noprint" id="ttsFab" aria-label="${u().listen}">${SPK}</button>`;
}
function bindAudio(){
  ["ttsPlay","ttsFab"].forEach(id=>{ const b=document.getElementById(id); if(b) b.onclick=playSpeech; });
  const s=document.getElementById("ttsStop"); if(s) s.onclick=()=>{ stopSpeech(); setTts("idle"); };
}

/* Liens WhatsApp : de vrais liens, qui ouvrent directement WhatsApp */
function askHref(n, prive){
  const link = (prive ? CONFIG.prive : CONFIG.whatsapp).trim();
  if(!link) return "#";
  const t = u().askText(n, n ? mods()[n-1].title : "");
  if(/wa\.me|api\.whatsapp\.com/.test(link)) return link + (link.includes("?")?"&":"?") + "text=" + encodeURIComponent(t);
  return link;
}
function askLink(n, label, cls, prive){
  return `<a class="${cls}" href="${askHref(n,prive)}" target="_blank" rel="noopener" data-ask="${n}" ${prive?'data-prive="1"':""}>${label}</a>`;
}
function bindAsk(){
  app.querySelectorAll("a[data-ask]").forEach(a=>a.addEventListener("click",e=>{
    e.preventDefault();
    const n=+a.dataset.ask, prive=!!a.dataset.prive;
    const link=(prive?CONFIG.prive:CONFIG.whatsapp).trim();
    if(!link){ toast(u().noLink); return; }
    const msg=u().askText(n, n ? mods()[n-1].title : "");
    const isWa=/wa\.me|api\.whatsapp\.com/.test(link);
    if(!isWa) copyQuiet(msg);
    openWaPanel(askHref(n,prive), isWa ? "" : msg);
  }));
}
function openWaPanel(href,msg){
  closeWaPanel();
  const U=u(), d=document.createElement("div"); d.className="wapanel"; d.id="wapanel";
  d.innerHTML=`<div class="wabox" role="dialog" aria-modal="true">
   <h2>${U.waTitle}</h2>
   ${msg?`<p>${U.waMsg}</p><blockquote>${msg}…</blockquote>`:""}
   <a class="btn" href="${href}" target="_blank" rel="noopener">${U.waOpen}</a>
   <p class="empty">${U.waHelp}</p>
   <input class="field" readonly value="${href}" dir="ltr" onclick="this.select()">
   <div class="actions"><button class="btn ghost" id="waCopy">${U.waCopy}</button><button class="btn ghost" id="waClose">${U.waClose}</button></div>
  </div>`;
  document.body.appendChild(d);
  d.onclick=ev=>{ if(ev.target===d) closeWaPanel(); };
  d.querySelector("#waCopy").onclick=()=>{ copyQuiet(href); toast(U.waCopied); };
  d.querySelector("#waClose").onclick=closeWaPanel;
}
function closeWaPanel(){ const p=document.getElementById("wapanel"); if(p) p.remove(); }
function copyQuiet(text){
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).catch(()=>fallback()); return; } }catch(e){}
  fallback();
  function fallback(){ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(e){} ta.remove(); }
}

function renderModule(i){

  if(!m){ return renderHome(); }

  if(!isOpen(i)){ toast(U.locked(i)); return go("accueil"); }

    ${audioBlock(i+1)}
    <div class="lesson">${m.html}</div>
    <div class="actions noprint">${askLink(i+1, U.askModule, "btn ghost", false)}</div>
    <section class="quiz noprint" aria-labelledby="qz">
      <h2 id="qz">${U.quizTitle(i+1)}</h2>
      ${isPassed(i) ? `<p class="result" style="color:var(--ok)">${U.quizPassed}</p>` : `<p>${U.quizHint}</p>`}
      ${m.quiz.map((q,qi)=>`<fieldset class="q" id="qf${qi}" style="border:0;padding:0"></fieldset>`).join("")}
      <button class="btn" id="check">${U.check}</button>
      <div class="result" id="res" aria-live="polite"></div>
    </section>
  </article>`;
  bindAudio(); bindAsk();
  const ver = m.quiz.map(()=>0);
  const cur = qi => ver[qi] ? Object.assign({}, m.quiz[qi].v, {ex:m.quiz[qi].ex}) : m.quiz[qi];
  function drawQ(qi, explain){
    const q=cur(qi), fsq=document.getElementById("qf"+qi);
    fsq.innerHTML = (explain ? `<div class="explain"><div class="exhead"><strong>💡 ${U.exTitle}</strong><button class="spk small" data-say="${qi}" aria-label="${U.exListen}">${SPK}</button></div><p>${m.quiz[qi].ex}</p><p class="newq">🔁 ${U.newQ}</p></div>` : "")
      + `<p>${qi+1}. ${q.q}</p>` + q.o.map((o,oi)=>`<label><input type="radio" name="q${qi}" value="${oi}"> <span>${o}</span></label>`).join("");
    const sb=fsq.querySelector("[data-say]"); if(sb) sb.onclick=()=>speakText(m.quiz[qi].ex);
  }
  m.quiz.forEach((_,qi)=>drawQ(qi,false));
  document.getElementById("check").onclick = ()=>{
    const res = document.getElementById("res");
    const sels = m.quiz.map((_,qi)=>app.querySelector(`#qf${qi} input:checked`));

    const wrong=[];

      app.querySelectorAll(`#qf${qi} label`).forEach(l=>l.classList.remove("right","wrong"));
      if(+sel.value===cur(qi).a) sel.parentElement.classList.add("right"); else wrong.push(qi);

      const last = i===NMOD-1;
      res.innerHTML = `<span style="color:var(--ok)">${U.success}</span>
        <div class="actions">${last ? `<button class="btn" data-go="certificat">${U.cert}</button>` : `<button class="btn" data-go="module-${i+2}">${U.next(i+2)}</button>`}
        <button class="btn ghost" data-go="accueil">${U.back}</button></div>`;
      res.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
    } else {
      wrong.forEach(qi=>{ ver[qi]=1-ver[qi]; drawQ(qi,true); });
      res.textContent = U.retry(wrong.length);
      document.getElementById("qf"+wrong[0]).scrollIntoView({behavior:"smooth",block:"start"});
    }
  };
  window.scrollTo(0,0);
}

function renderOutils(){
  if(!UNLOCKED) return go("inscription");
  homeBtn.hidden = false;
  const U=u();
  app.innerHTML = `<article class="module">
    <div class="num">${U.toolsTag}</div><h1>${U.toolsTitle}</h1>
    <p>${U.toolsIntro}</p>
    ${MESSAGES.map((mm,k)=>`<h2>${U.msgTitles[k]}</h2><blockquote dir="ltr" lang="en">${mm[1]}</blockquote><button class="btn ghost" data-copy="${k}">${U.copyMsg}</button>`).join("")}
    <h2>${U.checklistTitle}</h2>
    ${U.checklist.map((c,k)=>`<label class="check"><input type="checkbox" data-ck="${k}" ${state.checks.includes(k)?"checked":""}> <span>${c}</span></label>`).join("")}
  </article>`;
  app.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{ copyQuiet(MESSAGES[+b.dataset.copy][1]); toast(U.copied); });
  app.querySelectorAll("[data-ck]").forEach(c=>c.onchange=()=>{
    const k=+c.dataset.ck; state.checks = c.checked ? [...new Set([...state.checks,k])] : state.checks.filter(x=>x!==k); save();
  });
  window.scrollTo(0,0);
}

function renderFaq(){
  if(!UNLOCKED) return go("inscription");
  homeBtn.hidden = false;
  const U=u();
  app.innerHTML = `<article class="module">
    <div class="num">${U.faqTag}</div><h1>${U.faq}</h1>
    ${CONFIG.faq.length ? CONFIG.faq.map(f=>`<h2>${U.mod} ${f.module} : ${f.question}</h2><p>${f.reponse}</p>${f.audio?`<audio controls preload="none" src="${f.audio}" style="width:100%"></audio>`:""}`).join("")
      : `<p>${U.faqEmpty}</p>`}
    <div class="actions">${askLink(0, U.askQ, "btn ghost", false)}</div>
  </article>`;
  bindAsk(); window.scrollTo(0,0);
}

function certNorm(s){ return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim(); }
function certHash(str){ let h1=0xdeadbeef, h2=0x41c6ce57;
  for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return ((h2>>>0).toString(16).padStart(8,"0")+(h1>>>0).toString(16).padStart(8,"0")).slice(0,8).toUpperCase(); }
function certId(name, ymd){ return `WMA-${ymd}-${certHash(certNorm(name)+"|"+ymd+"|"+CERT_SALT)}`; }
function ymdToDate(ymd){ return new Date(+ymd.slice(0,4), +ymd.slice(4,6)-1, +ymd.slice(6,8)); }

const CRYPTO_OK = !!(window.crypto && crypto.subtle);
const B32 = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
function b32enc(bytes){ let out="",bits=0,val=0; for(const b of bytes){ val=(val<<8)|b; bits+=8; while(bits>=5){ bits-=5; out+=B32[(val>>bits)&31]; } val&=(1<<bits)-1; } if(bits>0) out+=B32[(val<<(5-bits))&31]; return out; }
function b32dec(str){ const s=(str||"").toUpperCase().replace(/0/g,"O").replace(/1/g,"I").replace(/8/g,"B").replace(/[^A-Z2-7]/g,""); const out=[]; let bits=0,val=0; for(const ch of s){ val=(val<<5)|B32.indexOf(ch); bits+=5; if(bits>=8){ bits-=8; out.push((val>>bits)&255); } val&=(1<<bits)-1; } return new Uint8Array(out); }

function normName(n){ return (n||"").normalize("NFD").replace(/\p{M}/gu,"").toLowerCase().replace(/\s+/g," ").trim(); }
async function maskFor(name, nonce){
  const hex=[...nonce].map(x=>x.toString(16).padStart(2,"0")).join("");
  const h=await crypto.subtle.digest("SHA-256", new TextEncoder().encode("wma-code|"+normName(name)+"|"+hex));
  return new Uint8Array(h).slice(0,16);
}
async function decryptWithKey(raw){
  const key=await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(LOCKED.iv)}, key, b64d(LOCKED.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function tryCode(name, code){

  const b=b32dec(code); if(b.length<20) return null;
  const nonce=b.slice(0,4), wr=b.slice(4,20), m=await maskFor(name,nonce);
  const K=wr.map((x,i)=>x^m[i]);
  try{ return await decryptWithKey(K); }catch(e){ return null; }
}
async function keyFromPass(pass){
  const base=await crypto.subtle.importKey("raw", new TextEncoder().encode(pass.trim()), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:b64d(LOCKED.salt), iterations:LOCKED.iter, hash:"SHA-256"}, base, 128));
}
async function makeCode(K, name){

}

function flag(country){
  const iso = FLAG_ISO[country];
  if(!iso) return `<span class="flag noflag" aria-hidden="true"></span>`;

function isLearner(){ return !!(state.access && state.access.name && certNorm(state.access.name)!==certNorm(CONFIG.formateur)); }

async function syncStudent(){
  if(!isLearner()) return;
  try{
    const us = await withTimeout(fbUser(), 12000);
    const key = stuKey(state.access.name, state.access.code);
    const ref = firebase.database().ref("students/"+key);
    const snap = await withTimeout(ref.once("value"), 12000);
    const status = snap.child("status").val() || "active";
    state.lastCheck = Date.now();
    if(status==="revoked"){
      const was = state.revoked; state.revoked = true; UNLOCKED = null; save();
      if(!was) render();
      ref.child("devices/"+us.uid).set(Date.now()).catch(()=>{});
      return;
    }
    if(state.revoked){ state.revoked=false; save(); try{ UNLOCKED = await tryCode(state.access.name, state.access.code); }catch(e){} render(); }
    const up = {}; const now = Date.now();
    if(!snap.child("name").exists()){ up.name = state.access.name; up.startedAt = now; }
    up["devices/"+us.uid] = now; up.lastSeen = now; up.progress = Math.min(NMOD, state.passed.length);
    if(state.certDl && !snap.child("certDlAt").exists() && allDone()) up.certDlAt = state.certDl;
    if(allDone() && !snap.child("finishedAt").exists()){
      if(!state.certDate){ const d=new Date(); state.certDate=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`; }
      up.finishedAt = now; up.certId = certId(state.access.name, state.certDate);
    }
    if(state.profile && !snap.child("country").exists()){ up.country=state.profile.country; up.city=state.profile.city; if(state.profile.district) up.district=state.profile.district; }
    if(state.profile && state.profile.sex && !snap.child("sex").exists()) up.sex=state.profile.sex;
    state.profileDone = (snap.child("country").exists() && snap.child("sex").exists()) || !!(state.profile && state.profile.sex);
    save();
    await ref.update(up);
    startHeartbeat(ref);
  }catch(e){ /* hors ligne : on garde le dernier statut connu */ }
}
let _hb=null;
function startHeartbeat(ref){
  if(_hb) return;
  const beat=()=>{ if(document.visibilityState==="visible" && !state.revoked) ref.child("lastSeen").set(Date.now()).catch(()=>{}); };
  _hb=setInterval(beat, 60000);
  document.addEventListener("visibilitychange", beat);
}
function markCertDl(){
  if(!state.certDl){ state.certDl=Date.now(); save(); }
  if(!isLearner()) return;
  fbUser().then(()=>firebase.database().ref("students/"+stuKey(state.access.name,state.access.code)+"/certDlAt").set(state.certDl)).catch(()=>{});
}

      const pv=new firebase.auth.GoogleAuthProvider(); pv.setCustomParameters({login_hint:ADMIN_EMAIL, prompt:"select_account"});
      try{ await a.signInWithPopup(pv); renderGestion(); }
      catch(e){ if(e && (e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")) a.signInWithRedirect(pv); else toast("Connexion annulée."); }
    };
    return;
  }
  document.getElementById("gInfo").innerHTML=`Connecté : ${esc(a.currentUser.email)} <button class="linkbtn" id="gOut">Se déconnecter</button>`;
  document.getElementById("gOut").onclick=async()=>{ if(_gLive){ _gLive(); _gLive=null; } await a.signOut(); renderGestion(); };
  document.getElementById("gBody").innerHTML=`
    <p class="empty" id="gUpd">Chargement…</p>
    <div id="gStats"></div>
    <h2>Liste des apprenants</h2>
    <input class="field" id="gQ" placeholder="Chercher un nom, une ville…">
    <select class="field" id="gF"><option value="">Tous les statuts</option><option value="online">En ligne maintenant</option><option value="run">En cours</option><option value="done">Ont terminé (tous)</option><option value="done_cert">Terminé, attestation téléchargée</option><option value="done_nocert">Terminé, attestation pas téléchargée</option><option value="revoked">Retirés</option></select>
    <select class="field" id="gS"><option value="">Hommes et femmes</option><option value="H">Hommes</option><option value="F">Femmes</option><option value="?">Sexe non renseigné</option></select>
    <ul class="glist" id="gList"></ul>
    <p class="empty">« En ligne » veut dire que l’application est ouverte en ce moment (activité dans les 3 dernières minutes). Un apprenant retiré ne voit plus le cours dès qu’il ouvre l’application avec internet ; « Rétablir » lui rend l’accès. Plus de 2 téléphones sur une même fiche peut signaler un code partagé.</p>`;
  const ref=firebase.database().ref("students");
  let all=[];
  const S=r=>r.status==="revoked"?"revoked":(r.finishedAt?"done":"run");
  const lab={done:"Terminé",run:"En cours",revoked:"Retiré"};
  const isOn=r=>r.status!=="revoked" && r.lastSeen && (Date.now()-r.lastSeen)<ONLINE_MS;
  const prog=r=>r.finishedAt?NMOD:Math.max(0,Math.min(NMOD,+r.progress||0));
  const sexL=r=>r.sex==="H"?"Homme":r.sex==="F"?"Femme":"Non renseigné";
  const nDev=r=>r.devices?Object.keys(r.devices).length:0;
  const d=t=>t?new Date(t).toLocaleDateString("fr-FR"):"–";
  const group=(rows,keyf,cols)=>{ const o={}; rows.forEach(r=>{ const k=keyf(r); if(k==null) return; o[k]=o[k]||cols.map(()=>0); cols.forEach((c,i)=>{ if(c.f(r)) o[k][i]++; }); }); return o; };
  const table=(o,head,cols)=>`<div class="tscroll"><table class="gtab"><thead><tr><th>${head}</th>${cols.map(c=>`<th>${c.h}</th>`).join("")}</tr></thead><tbody>${Object.entries(o).sort((x,y)=>y[1][0]-x[1][0]).map(([k,v])=>`<tr><td>${esc(k)}</td>${v.map(n=>`<td>${n}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="${cols.length+1}">Aucune donnée</td></tr>`}</tbody></table></div>`;
  const C_ALL=[{h:"Inscrits",f:r=>true},{h:"Terminé",f:r=>S(r)==="done"},{h:"Attestation",f:r=>S(r)==="done"&&r.certDlAt}];
  const C_ON=[{h:"En ligne",f:r=>true}];
  const place=r=>[[r.city,r.district].filter(Boolean).join(", "),r.country].filter(Boolean).join(" – ");
  const drawStats=()=>{
    const on=all.filter(isOn), done=all.filter(r=>S(r)==="done");
    const active=all.filter(r=>S(r)!=="revoked");
    const avg=active.length?Math.round(active.reduce((s,r)=>s+prog(r),0)/active.length*10)/10:0;
    const buckets={"Pas commencé (0)":r=>prog(r)===0,"Modules 1 à 3":r=>prog(r)>=1&&prog(r)<=3,"Modules 4 à 6":r=>prog(r)>=4&&prog(r)<=6,"Modules 7 à 9":r=>prog(r)>=7&&prog(r)<=9,"Les 10 modules":r=>prog(r)===NMOD};
    document.getElementById("gStats").innerHTML=`
      <div class="gstats">
        <div class="on"><b>${on.length}</b>En ligne maintenant</div><div><b>${all.length}</b>Inscrits</div>
        <div><b>${all.filter(r=>S(r)==="run").length}</b>En cours</div><div><b>${done.length}</b>Ont terminé</div>
        <div><b>${done.filter(r=>r.certDlAt).length}</b>Terminé avec attestation</div><div><b>${done.filter(r=>!r.certDlAt).length}</b>Terminé sans attestation</div>
        <div><b>${all.filter(r=>r.sex==="H").length}</b>Hommes</div><div><b>${all.filter(r=>r.sex==="F").length}</b>Femmes</div>
        <div><b>${avg} / ${NMOD}</b>Progression moyenne</div><div><b>${all.filter(r=>S(r)==="revoked").length}</b>Retirés</div>
      </div>
      <h2>En ligne maintenant</h2>
      ${on.length?`<h3>Par pays</h3>${table(group(on,r=>r.country||"Non renseigné",C_ON),"Pays",C_ON)}<h3>Par ville</h3>${table(group(on,r=>r.city?`${r.city} (${r.country||"?"})`:"Non renseigné",C_ON),"Ville",C_ON)}`:`<p>Personne n’a l’application ouverte en ce moment.</p>`}
      <h2>Par pays</h2>${table(group(all,r=>r.country||"Non renseigné",C_ALL),"Pays",C_ALL)}
      <h2>Par ville</h2>${table(group(all,r=>r.city?`${r.city} (${r.country||"?"})`:"Non renseigné",C_ALL),"Ville",C_ALL)}
      <h2>Par sexe</h2>${table(group(all,sexL,C_ALL),"Sexe",C_ALL)}
      <h2>Progression (apprenants non retirés)</h2>
      <div class="tscroll"><table class="gtab"><thead><tr><th>Niveau</th><th>Total</th><th>Hommes</th><th>Femmes</th></tr></thead><tbody>
      ${Object.entries(buckets).map(([k,f])=>{ const g=active.filter(f); return `<tr><td>${k}</td><td>${g.length}</td><td>${g.filter(r=>r.sex==="H").length}</td><td>${g.filter(r=>r.sex==="F").length}</td></tr>`; }).join("")}
      </tbody></table></div>`;
    document.getElementById("gUpd").textContent=`Mis à jour à ${new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}. Les chiffres se mettent à jour tout seuls.`;
  };
  const draw=()=>{
    const q=certNorm(document.getElementById("gQ").value), f=document.getElementById("gF").value, sx=document.getElementById("gS").value;
    const okF=r=>!f||(f==="online"?isOn(r):f==="done_cert"?(S(r)==="done"&&r.certDlAt):f==="done_nocert"?(S(r)==="done"&&!r.certDlAt):S(r)===f);
    const okS=r=>!sx||(sx==="?"?!r.sex:r.sex===sx);
    const list=all.filter(r=>okF(r)&&okS(r)&&(!q||certNorm([r.name,r.city,r.district,r.country].join(" ")).includes(q))).sort((x,y)=>(y.lastSeen||0)-(x.lastSeen||0));
    document.getElementById("gList").innerHTML=list.map(r=>{ const s=S(r), n=nDev(r), p=prog(r);
      return `<li class="${s}"><div class="n">${isOn(r)?`<span class="dotOn" title="En ligne"></span>`:""}${flag(r.country)}${esc(r.name||"(sans nom)")} <span class="tag ${s}">${lab[s]}</span></div>
        <div class="p">${esc(place(r)||"Lieu non renseigné")}, ${sexL(r).toLowerCase()}</div>
        <div class="gprog"><span style="width:${p/NMOD*100}%"></span></div><div class="p">${p} module${p>1?"s":""} sur ${NMOD}${s==="done"?(r.certDlAt?`, attestation téléchargée le ${d(r.certDlAt)}`:", attestation pas encore téléchargée"):""}</div>
        <div class="p">Début ${d(r.startedAt)}, fin ${d(r.finishedAt)}, vu ${isOn(r)?"maintenant":d(r.lastSeen)}, <span class="${n>2?"warn":""}">${n} téléphone${n>1?"s":""}</span></div>
        <div class="gact">${s==="revoked"?`<button class="btn" data-k="${r.key}" data-a="active">Rétablir l’accès</button>`:`<button class="btn ghost" data-k="${r.key}" data-a="revoked">Retirer l’accès</button>`}
        <button class="linkbtn" data-k="${r.key}" data-a="del">Effacer la fiche</button></div></li>`; }).join("")||`<li>Aucun apprenant.</li>`;
    document.querySelectorAll("#gList [data-a]").forEach(b=>b.onclick=async()=>{
      const k=b.dataset.k, act=b.dataset.a, r=all.find(x=>x.key===k);
      try{
        if(act==="del"){ if(!confirm(`Effacer la fiche de ${r.name} ? S’il a encore son code, il pourra revenir comme un nouvel apprenant. Pour l’empêcher de revenir, utilisez plutôt « Retirer l’accès ».`)) return;
          await ref.child(k).remove(); }
        else { if(act==="revoked" && !confirm(`Retirer l’accès de ${r.name} ?`)) return;
          await ref.child(k+"/status").set(act); }
        toast("Modification enregistrée.");
      }catch(e){ toast("Échec : vérifiez la connexion et les règles de la base."); }
    });
  };
  document.getElementById("gQ").oninput=draw; document.getElementById("gF").onchange=draw; document.getElementById("gS").onchange=draw;
  const onVal=snap=>{ if(location.hash!=="#gestion") return stop(); all=[]; snap.forEach(c=>{ all.push(Object.assign({key:c.key},c.val()||{})); }); drawStats(); draw(); };
  const onErr=()=>{ const g=document.getElementById("gUpd"); if(g) g.textContent="Lecture impossible. Vérifiez la connexion et les règles de la base."; };
  ref.on("value", onVal, onErr);
  const tick=setInterval(()=>{ if(location.hash!=="#gestion") return stop(); if(all.length){ drawStats(); draw(); } }, 60000);
  function stop(){ ref.off("value", onVal); clearInterval(tick); _gLive=null; }
  _gLive=stop;
}

async function boot(){
  if(state.access && CRYPTO_OK && !state.revoked){ try{ UNLOCKED = await tryCode(state.access.name, state.access.code); }catch(e){ UNLOCKED=null; } }
  render();
  syncStudent();
}

/* Navigation */
function render(){
  stopSpeech(); closeWaPanel();
  const h = location.hash.replace("#","");
  if(h.startsWith("verifier")){ if(state.uilang) applyLang(); return renderVerify(h); }
  if(!state.uilang) return renderLangChoice();
  applyLang();
  if(h==="langue") return renderLangChoice();
  if(h==="gestion") return renderGestion();
  if(state.revoked && isLearner() && !["formateur","espace-formateur"].includes(h)) return renderRevoked();
  if(h==="salle") return UNLOCKED ? renderSalle() : renderSalleLocked();
  if(h==="profil" && UNLOCKED && isLearner()) return renderProfile();
  if(h==="intro") return renderIntro();
  if(h==="inscription") return renderPay();
  if(h==="espace-formateur") return renderAdmin();
  if(h==="formateur") return renderTrainer();
  if(h.startsWith("module-")) return renderModule(+h.split("-")[1]-1);
  if(h==="outils") return renderOutils();
  if(h==="faq") return renderFaq();
  if(h==="certificat") return renderCert();
  renderHome(); window.scrollTo(0,0);
}
homeBtn.onclick=()=>go("accueil");
document.getElementById("langBtn").onclick=()=>go("langue");
window.addEventListener("hashchange",render);

/* Thème */
document.getElementById("themeBtn").onclick=()=>{
  const r=document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
  try{ localStorage.setItem(KEY+"-theme", r.dataset.theme); }catch(e){}
};
try{ const th=localStorage.getItem(KEY+"-theme"); if(th) document.documentElement.dataset.theme=th; }catch(e){}

boot();
</script>
</body>
